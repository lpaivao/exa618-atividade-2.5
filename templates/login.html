<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Login</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 400px;
        margin: 80px auto;
        padding: 0 20px;
      }
      input {
        display: block;
        width: 100%;
        padding: 8px;
        margin: 8px 0 16px;
        box-sizing: border-box;
        border: 1px solid #ccc;
        border-radius: 4px;
      }
      button {
        background: #0077cc;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 4px;
        cursor: pointer;
        width: 100%;
      }
      .erro {
        color: red;
        margin-bottom: 12px;
      }
    </style>
  </head>
  <body>
    <h1>Login</h1>
    {% if erro %}
    <p class="erro">{{ erro }}</p>
    {% endif %}
    <form method="POST" action="/login">
      <label>Usuário:</label>
      <input type="text" name="usuario" required />
      <label>Senha:</label>
      <input type="password" name="senha" required />
      <button type="submit">Entrar</button>
    </form>
    <p><a href="/">← Voltar</a></p>
  </body>
</html>
